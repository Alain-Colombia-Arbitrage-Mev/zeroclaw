# Promtail config — ships container stdout AND ZeroClaw audit
# JSONL files into Loki.
#
# Two scrape paths:
#   1. Docker containers via the socket — every service in the
#      compose file gets followed automatically.
#   2. The /zeroclaw-workspace/audit/ directory (mounted RO from
#      the zeroclaw-workspace volume) — JSONL audit files produced
#      by the daemon when [observability.audit] is enabled.
#
# Both paths add labels for filtering in Grafana: service=,
# tenant= (when present), and either container_name= (path 1)
# or audit_kind= (path 2).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Batch reduces network calls on bursty audit log paths.
    batchwait: 1s
    batchsize: 1048576    # 1 MiB

scrape_configs:
  # ── Path 1: Docker container stdout ────────────────────────────
  - job_name: containerlogs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      # Promote the container name to a label so Grafana queries
      # can filter by service.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      # Tag every line with the compose project for multi-host
      # deployments.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

  # ── Path 2: ZeroClaw audit JSONL ───────────────────────────────
  - job_name: zeroclaw_audit
    static_configs:
      - targets: [localhost]
        labels:
          job: zeroclaw_audit
          service: zeroclaw-daemon
          __path__: /zeroclaw-workspace/audit/*.jsonl
    pipeline_stages:
      # Each audit JSONL row is one event. Parse it so Loki labels
      # can include tool_name, http_method, tenant_id, etc.
      - json:
          expressions:
            ts: timestamp
            tool: tool_name
            kind: event_kind
            tenant: tenant_id
            method: http_method
            status: http_status_code
      - labels:
          tool:
          kind:
          tenant:
      - timestamp:
          source: ts
          format: RFC3339Nano
          fallback_formats:
            - RFC3339

  # ── Path 3: MiroFish forensic generation logs ─────────────────
  # When [mirofish.logging] enabled = true in config.toml, the
  # market_sentiment_analyst preset writes one JSON file per HTTP
  # call to <workspace>/<generation_log_dir>/. We tail those too.
  - job_name: mirofish_generation_log
    static_configs:
      - targets: [localhost]
        labels:
          job: mirofish_generation_log
          service: market_sentiment_analyst
          __path__: /zeroclaw-workspace/mirofish-logs/**/*.json
    pipeline_stages:
      - json:
          expressions:
            sim_id: simulation_id
            graph_id: graph_id
            stage: stage
      - labels:
          sim_id:
          stage:
