# Standalone Qdrant compose for the ZeroClaw vector memory backend.
#
# Designed for two modes:
#   - Local dev: ZeroClaw runs natively (`cargo run -- daemon`) and
#     Qdrant runs in this container on the same host.
#   - Production VPS (Hetzner / any Linux): Qdrant on the same box as
#     the ZeroClaw daemon, bound to localhost or a private network only,
#     with API-key auth so an open 6333 port doesn't hand the whole
#     vector store to the public internet.
#
# Local dev
# ---------
#   docker compose -f docker-compose.qdrant.yml up -d
#   # → REST :6333, gRPC :6334, dashboard http://localhost:6333/dashboard
#
# Hetzner / production VPS
# ------------------------
#   # 1. Set a strong api key in .env on the VPS (NOT in this file):
#   #      QDRANT_API_KEY=$(openssl rand -hex 32)
#   #      QDRANT_BIND_HOST=127.0.0.1   # keep port loopback-only
#   # 2. docker compose -f docker-compose.qdrant.yml up -d
#   # 3. In `~/.zeroclaw/config.toml`:
#   #      [memory.qdrant]
#   #      url = "http://127.0.0.1:6333"
#   #      api_key = "<same value as QDRANT_API_KEY>"
#   # 4. (Optional, recommended) Front Qdrant with a reverse-proxy +
#   #    Let's Encrypt cert if you need to reach it from outside the VPS.
#   #    See docs/ops/qdrant-vps-deploy.md.
#
# Wire-up in `~/.zeroclaw/config.toml`
# ------------------------------------
#   [memory]
#   backend = "qdrant"
#   embedding_provider = "openai"
#   embedding_model = "text-embedding-3-small"
#
#   [memory.qdrant]
#   url = "http://localhost:6333"
#   collection = "zeroclaw_memories"
#   api_key = "..."        # required in production; reads from env if blank
#
# Backups: snapshots persist in the `qdrant-snapshots` volume. Schedule
# `curl -X POST http://localhost:6333/snapshots -H "api-key: $KEY"` from
# cron or the ZeroClaw scheduler for periodic backups.
#
# Embeddings: reuse your OpenRouter key (OpenAI-compatible /v1/embeddings).
# For local-only embeddings, point `embedding_provider = "ollama"` and
# pull `nomic-embed-text`.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: zeroclaw-qdrant
    restart: unless-stopped
    ports:
      # Bind to QDRANT_BIND_HOST (default 127.0.0.1) so a public VPS
      # doesn't expose Qdrant to the internet. Override with
      # `QDRANT_BIND_HOST=0.0.0.0` only when you've put a real TLS +
      # auth proxy in front, or use the docker network for the daemon
      # and never publish the port at all.
      - "${QDRANT_BIND_HOST:-127.0.0.1}:${QDRANT_REST_PORT:-6333}:6333"
      - "${QDRANT_BIND_HOST:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      # API-key auth (empty → unauthenticated; production MUST set this).
      # The same value goes into [memory.qdrant].api_key on the daemon.
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
      # Tune to host: each is bytes-per-request / threads. Linear in RAM
      # and cores; defaults work on a 4 GB Hetzner CX22 / 16 GB laptop.
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "${QDRANT_MAX_REQ_MB:-32}"
      QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS: "${QDRANT_OPT_THREADS:-2}"
      # TLS for the REST API (optional; usually a reverse proxy is
      # simpler). To enable: set QDRANT_TLS_CERT + QDRANT_TLS_KEY to
      # absolute paths inside the container and uncomment in volumes.
      # QDRANT__SERVICE__ENABLE_TLS: "true"
    volumes:
      # Persistent on-disk vector store.
      - qdrant-data:/qdrant/storage
      # Snapshots written via `POST /snapshots`. Mount so they survive
      # container removal — back up this directory off-box for DR.
      - qdrant-snapshots:/qdrant/snapshots
      # TLS material (uncomment when QDRANT__SERVICE__ENABLE_TLS=true):
      # - ./tls/qdrant.crt:/etc/ssl/qdrant/qdrant.crt:ro
      # - ./tls/qdrant.key:/etc/ssl/qdrant/qdrant.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # Override on smaller VPSes: 1G is comfortable for ~100k
          # 1536-dim vectors; bump to 4G if you hit OOMs after seeding
          # large corpora.
          memory: ${QDRANT_MEM_LIMIT:-1G}
        reservations:
          memory: 128M

volumes:
  qdrant-data:
  qdrant-snapshots:
